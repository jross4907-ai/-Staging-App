    window.__STAGER_MOUNTED__ = false;
    function showBootError(msg) {
      var el = document.getElementById("boot-error");
      if (el) {
        el.style.display = "block";
        el.textContent = msg;
      }
    }
    window.addEventListener("error", function (e) {
      if (!window.__STAGER_MOUNTED__) {
        showBootError("App failed to start: " + (e.message || "Script error. Try refreshing."));
      }
    });
    setTimeout(function () {
      if (!window.__STAGER_MOUNTED__) {
        if (typeof React === "undefined" || typeof ReactDOM === "undefined" || typeof Babel === "undefined") {
          showBootError("Could not load required libraries (React/Babel). Check your internet connection or ad-blocker and refresh.");
        } else {
          showBootError("The app took too long to start. Try refreshing the page or clearing your browser cache.");
        }
      }
    }, 8000);

      constructor(props) {
        super(props);
        this.state = { hasError: false, message: "" };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, message: error?.message || "Unexpected error" };
      }

        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
              <div className="max-w-md w-full bg-white border border-red-200 rounded-2xl p-6 shadow-lg space-y-3">
                <h2 className="text-lg font-bold text-red-700">Something went wrong</h2>
                <p className="text-sm text-slate-600">{this.state.message}</p>
                <button
                  onClick={() => window.location.reload()}
                  className="px-4 py-2 bg-blue-600 text-white text-sm font-semibold rounded-xl"

    /* =========================================================================
       PERSISTENT STORAGE HELPERS (localStorage + Cookie fallback + URL #hash)
       ========================================================================= */
    const setCookie = (name, value, days = 365) => {
      try {
        const expires = new Date(Date.now() + days * 864e5).toUTCString();
        document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
      } catch (e) {}
    };

    const getCookie = (name) => {
      try {
        const match = document.cookie.match(new RegExp("(^| )" + name + "=([^;]+)"));
        return match ? decodeURIComponent(match[2]) : "";
      } catch (e) {
        return "";
      }
    };

    const deleteCookie = (name) => {
      try {
        document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax`;
      } catch (e) {}
    };

    const savePersistent = (key, value) => {
      let saved = false;
      try {
        localStorage.setItem(key, value);
        if (localStorage.getItem(key) === value) saved = true;
      } catch (e) {}
      setCookie(key, value, 365);
      if (getCookie(key) === value) saved = true;
      return saved;
    };

    const loadPersistent = (key) => {
      try {
        const val = localStorage.getItem(key);
        if (val) return val;
      } catch (e) {}
      return getCookie(key) || "";
    };

    const removePersistent = (key) => {
      try {
        localStorage.removeItem(key);
      } catch (e) {}
      deleteCookie(key);
    };

    const checkStorageAvailable = () => {
      const testKey = "__jrg_storage_test__";
      const ok = savePersistent(testKey, "1");
      removePersistent(testKey);
      return ok;

    // Read API key from private #key=... URL hash if present (never sent to server)
    const extractHashApiKey = () => {
      try {
        const hash = window.location.hash || "";
        const match = hash.match(/key=([^&]+)/);
        if (match && match[1]) {
          const decoded = decodeURIComponent(match[1]).trim();
          if (decoded) {
            savePersistent(STORAGE_KEY_API, decoded);
            if (window.history && window.history.replaceState) {
              window.history.replaceState(null, "", window.location.pathname + window.location.search);
            }
            return decoded;
          }
        }
      } catch (e) {}
      return "";
    };

        setApiKey(cleanedKey);
        setImageModel(cleanedModel);
        if (cleanedKey) {
          const saved = savePersistent(STORAGE_KEY_API, cleanedKey);
          savePersistent(STORAGE_KEY_MODEL, cleanedModel);
          setStorageBlocked(!saved);
          notify(saved ? "API key saved on this device!" : "Key active for now (storage blocked by browser).");
        } else {
          removePersistent(STORAGE_KEY_API);
          notify("API key cleared.");
        }
        setShowSettingsModal(false);
        setError(null);
      };

      const clearApiKey = () => {
        setApiKey("");
        setTempKey("");
        removePersistent(STORAGE_KEY_API);
        notify("API key removed from this device.");
      };

      const copyBookmarkLink = () => {
        const keyToUse = (tempKey || apiKey).trim();
        if (!keyToUse) return;
        const baseUrl = window.location.origin + window.location.pathname;
        const link = `${baseUrl}#key=${encodeURIComponent(keyToUse)}`;
        const textarea = document.createElement("textarea");
        textarea.value = link;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand("copy");
          notify("Private auto-login bookmark link copied!");
        } catch (err) {
          notify("Could not copy automatically. Try saving in regular Safari/Chrome.");
        }
        document.body.removeChild(textarea);
      };

      // Analyze uploaded image with Gemini 3 Flash for smart staging suggestions
      const getAiSuggestions = async (base64, mime) => {
        if (!apiKey) return;
        setIsAnalyzing(true);
        setAiSuggestions([]);
        try {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${SUGGESTION_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;
          const aiPrompt =
            `Analyze this handcrafted ${projectType} in the photo. Create 3 highly descriptive staging environment prompts suitable for a Facebook Marketplace listing. Match the season, style, and natural placement (${placementStyle}) of the item. Return ONLY a JSON object with a single property 'prompts' containing an array of 3 strings. Each string should be a full descriptive prompt.`;

          const payload = {
            contents: [
              {
                role: "user",
                parts: [
                  { text: aiPrompt },
                  { inlineData: { mimeType: mime, data: base64 } }
                ]
              }
            ],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  prompts: {
                    type: "ARRAY",
                    items: { type: "STRING" }
                  }
                }
              }
            }
          };

          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (jsonText) {
            const parsed = JSON.parse(jsonText);
            if (Array.isArray(parsed.prompts)) {
              setAiSuggestions(parsed.prompts);
            }
          }
        } catch (err) {
          console.error("Failed to fetch AI suggestions:", err);
        } finally {
          setIsAnalyzing(false);
        }
      };

      // Process uploaded file into base64
      const processFile = (file) => {
        if (!file) return;
        setSelectedImage(URL.createObjectURL(file));
        setResultImage(null);
        setError(null);
        setShowSlider(false);
        setAiSuggestions([]);

        const reader = new FileReader();
        reader.onloadend = () => {
          const result = reader.result;
          const match = result.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,(.+)$/);
          if (match) {
            setMimeType(match[1]);
            setBase64Data(match[2]);
            getAiSuggestions(match[2], match[1]);
          } else {
            setError("Failed to process image format. Please use PNG, JPG, or WEBP.");
          }
        };
        reader.readAsDataURL(file);
      };

      const handleImageUpload = (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length > 0) {
          processFile(files[0]);
          setQueue(files.length > 1 ? files.slice(1) : []);
        }
      };

      const onDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const onDragLeave = (e) => {
        e.preventDefault();
        setIsDragging(false);
      };

      const onDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        const files = Array.from(e.dataTransfer.files || []).filter((f) =>
          f.type.startsWith("image/")
        );
        if (files.length > 0) {
          processFile(files[0]);
          setQueue(files.length > 1 ? files.slice(1) : []);
        }
      };

      // Generate staged image using Nano Banana (Gemini image model)
      const handleGenerate = async () => {
        if (!apiKey) {
          setError("Please add your Gemini API key first (tap 'Set API Key' at the top right).");
          openSettings();
          return;
        }
        if (!base64Data || !mimeType) {
          setError("Please upload an image first.");
          return;
        }
        if (!prompt.trim()) {
          setError("Please enter a staging description.");
          return;
        }

        setIsGenerating(true);
        setError(null);
        setResultImage(null);
        setShowSlider(false);

        try {
          const activeModel = (imageModel || DEFAULT_IMAGE_MODEL).trim();
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(activeModel)}:generateContent?key=${encodeURIComponent(apiKey)}`;

          const placementRule =
            PLACEMENT_OPTIONS.find((p) => p.value === placementStyle)?.instruction ||
            PLACEMENT_OPTIONS[0].instruction;

          let finalPrompt = `Take the provided image of the ${projectType} and perfectly integrate it into the following scene: ${prompt}. The physical dimensions of this item are approximately ${projectSize}. `;

          if (frameStyle !== "None") {
            finalPrompt += `The item should have a clean, realistic ${frameStyle} frame around it. `;
          }

          finalPrompt += `
CRITICAL INSTRUCTIONS:
- Automatically remove the original workbench, floor, or room background from the provided photo so ONLY the handcrafted wooden project itself is placed into the new scene.
- PLACEMENT: ${placementRule}
- Ensure the item is scaled realistically relative to the furniture, walls, mantels, porch elements, and overall room size.
- Match realistic shadows, ambient reflections, lighting direction, and perspective.
- DO NOT alter the wood grain, paint/stain colors, carvings, stars/stripes, or exact shape of the handcrafted item. Preserve the original craftsmanship faithfully.`;

          const payload = {
            contents: [
              {
                role: "user",
                parts: [
                  { text: finalPrompt },
                  {
                    inlineData: {
                      mimeType: mimeType,
                      data: base64Data
                    }
                  }
                ]
              }
            ],
            generationConfig: {
              responseModalities: ["IMAGE"],
              imageConfig: { aspectRatio: aspectRatio }
            }
          };

          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.error?.message || "Failed to generate image from Gemini API.");
          }

          const generatedPart = result?.candidates?.[0]?.content?.parts?.find((p) => p.inlineData);
          if (generatedPart) {
            const generatedImageUrl = `data:${generatedPart.inlineData.mimeType};base64,${generatedPart.inlineData.data}`;
            setResultImage(generatedImageUrl);

            setHistory((prev) =>
              [
                {
                  id: Date.now(),
                  original: selectedImage,
                  staged: generatedImageUrl,
                  prompt: prompt,
                  time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
                },
                ...prev
              ].slice(0, 12)
            );
          } else {
            throw new Error("No image data was returned by the model. Try adjusting the prompt or model name in API Settings.");
          }
        } catch (err) {
          console.error(err);
          setError(err.message || "An unexpected error occurred during generation.");
        } finally {
          setIsGenerating(false);
        }
      };

      const processNextInQueue = () => {
        if (queue.length > 0) {
          const nextFile = queue[0];
          setQueue((prev) => prev.slice(1));
          processFile(nextFile);
        }
      };

      // Bake watermark onto canvas & trigger iOS Share Sheet (or desktop download)
      const handleDownload = (imgUrl = resultImage) => {
        if (!imgUrl) return;

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const img = new Image();
        img.crossOrigin = "Anonymous";

        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);

          if (watermarkText.trim()) {
            const fontSize = Math.max(24, Math.round(canvas.height * 0.035));
            ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
            ctx.fillStyle = "rgba(255, 255, 255, 0.78)";
            ctx.shadowColor = "rgba(0, 0, 0, 0.85)";
            ctx.shadowBlur = 8;
            ctx.textAlign = "right";
            ctx.fillText(watermarkText.trim(), canvas.width - 30, canvas.height - 30);
          }

          canvas.toBlob(async (blob) => {
            if (!blob) return;
            const fileName = `jrg-staged-${Date.now()}.png`;
            const file = new File([blob], fileName, { type: "image/png" });

            const fallbackDownload = () => {
              const a = document.createElement("a");
              a.href = canvas.toDataURL("image/png");
              a.download = fileName;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
            };

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              try {
                await navigator.share({
                  files: [file],
                  title: "Staged Project — JRG Custom Builds"
                });
              } catch (err) {
                if (err.name !== "AbortError") {
                  fallbackDownload();
                }
              }
            } else {
              fallbackDownload();
            }
          }, "image/png");
        };
        img.src = imgUrl;
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 font-sans pb-12">
          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-sm font-medium px-4 py-2.5 rounded-full shadow-xl border border-slate-700">
              {toastMsg}

          <nav className="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80">

                </div>
                <div>
                  <div className="font-extrabold text-base sm:text-lg leading-tight text-slate-900">
                    Stager <span className="text-blue-600">App</span>
                  </div>
                  <div className="text-[11px] font-medium text-slate-500 leading-tight">
                    JRG Custom Builds
                  </div>
                </div>
              </div>

              <button
                onClick={openSettings}
                className={`flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all border ${
                  apiKey
                    ? "bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100"
                    : "bg-amber-50 text-amber-800 border-amber-300 hover:bg-amber-100 animate-pulse"
                }`}
              >
                <KeyIcon size={15} />
                <span>{apiKey ? "API Key Connected" : "Set API Key"}</span>
              </button>
            </div>
          </nav>

          <div className="max-w-5xl mx-auto px-4 pt-6 md:pt-8 space-y-8">

            <header className="text-center space-y-2">
              <h1 className="text-2xl sm:text-4xl font-extrabold tracking-tight text-slate-900">
                Stage Your Woodworking Projects
              </h1>
              <p className="text-sm sm:text-base text-slate-600 max-w-2xl mx-auto">
                Pick what you're staging, upload your raw shop photo, and let Nano Banana create scroll-stopping Facebook Marketplace photos.
              </p>
            </header>

            {/* Main Workspace */}
            <main className="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden flex flex-col lg:flex-row">
              {/* Left Column: Controls */}
              <div className="flex-1 p-5 md:p-8 border-b lg:border-b-0 lg:border-r border-slate-100 space-y-7">
                {/* Step 1: Choose What You Are Staging */}
                <div className="space-y-3">
                  <h2 className="text-lg font-bold flex items-center gap-2 text-slate-800">
                    <span className="flex items-center justify-center w-6 h-6 rounded-full bg-blue-600 text-white text-xs font-bold">
                      1
                    </span>
                    What Are You Staging?
                  </h2>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                    {STAGE_CATEGORIES.map((cat) => {
                      const isActive = selectedCategory === cat.id;
                      return (
                        <button
                          key={cat.id}
                          type="button"
                          onClick={() => handleSelectCategory(cat)}
                          className={`p-3 rounded-2xl border-2 text-left transition-all flex flex-col gap-1 ${
                            isActive
                              ? "border-blue-600 bg-blue-50/80 shadow-sm ring-2 ring-blue-500/20"
                              : "border-slate-200 bg-white hover:border-blue-300 hover:bg-slate-50"
                          }`}
                        >
                          <span className="text-xl leading-none">{cat.badge}</span>
                          <span className={`text-sm font-bold leading-tight mt-1 ${isActive ? "text-blue-900" : "text-slate-800"}`}>
                            {cat.title}
                          </span>
                          <span className="text-[11px] text-slate-500 leading-tight">
                            {cat.subtitle}
                          </span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Step 2: Upload */}
                <div className="space-y-3">
                  <h2 className="text-lg font-bold flex items-center gap-2 text-slate-800">
                    <span className="flex items-center justify-center w-6 h-6 rounded-full bg-blue-600 text-white text-xs font-bold">
                      2
                    </span>
                    Upload Your {STAGE_CATEGORIES.find((c) => c.id === selectedCategory)?.title || "Project"}
                  </h2>
                  <div
                    onClick={() => fileInputRef.current?.click()}
                    onDragOver={onDragOver}
                    onDragLeave={onDragLeave}
                    onDrop={onDrop}
                    className={`relative border-2 border-dashed rounded-2xl p-6 text-center cursor-pointer transition-all ${
                      isDragging
                        ? "border-blue-500 bg-blue-100 scale-[1.01]"
                        : selectedImage
                        ? "border-blue-300 bg-blue-50/70"
                        : "border-slate-300 hover:border-blue-400 hover:bg-slate-50"
                    }`}
                  >
                    <input
                      type="file"
                      ref={fileInputRef}
                      onChange={handleImageUpload}
                      accept="image/jpeg, image/png, image/webp"
                      multiple
                      className="hidden"
                    />

                    {selectedImage ? (
                      <div className="space-y-3">
                        <img
                          src={selectedImage}
                          alt="Uploaded Project"
                          className="max-h-48 mx-auto rounded-xl shadow-sm object-contain"
                        />
                        <div className="flex items-center justify-center gap-1.5 text-blue-700 font-semibold text-sm">
                          <CheckCircleIcon size={17} /> Image Selected
                        </div>
                        {queue.length > 0 && (
                          <p className="text-xs font-bold text-amber-800 bg-amber-100 px-3 py-1 rounded-full inline-block">
                            +{queue.length} more in batch queue
                          </p>
                        )}
                        <p className="text-xs text-slate-500">Tap or drag to change photo(s)</p>
                      </div>
                    ) : (
                      <div className="space-y-3 py-4 pointer-events-none">
                        <div className="mx-auto w-14 h-14 bg-slate-100 rounded-full flex items-center justify-center text-slate-500">
                          <UploadCloudIcon size={28} className={isDragging ? "text-blue-500" : ""} />
                        </div>
                        <div>
                          <p className="font-semibold text-slate-700 text-sm sm:text-base">
                            Tap or drag to upload photo(s)
                          </p>
                          <p className="text-xs text-slate-500 mt-1">
                            PNG, JPG, or WEBP. Select multiple for batch queue.
                          </p>
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                {/* Step 3: Details & Settings */}
                <div className="space-y-3">
                  <h2 className="text-lg font-bold flex items-center gap-2 text-slate-800">
                    <span className="flex items-center justify-center w-6 h-6 rounded-full bg-blue-600 text-white text-xs font-bold">
                      3
                    </span>
                    Details & Image Settings
                  </h2>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                    <div className="flex flex-col gap-1.5 sm:col-span-2">
                      <label className="text-xs font-semibold text-slate-600 flex items-center gap-1.5">
                        <SparklesIcon size={14} /> Specific Project Name
                      </label>
                      <input
                        type="text"
                        value={projectType}
                        onChange={(e) => setProjectType(e.target.value)}
                        placeholder="e.g., Floating Wooden Cross, Fall Decor, Wavy Flag"
                        className="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm text-slate-800"
                      />
                      {selectedCategory === "seasonal" && (
                        <div className="flex flex-wrap gap-1.5 pt-0.5">
                          {[
                            { label: "Fall / Autumn Decor", size: '18" x 14"', placement: "Tabletop / Mantel / Shelf" },
                            { label: "Christmas / Holiday Decor", size: '20" x 16"', placement: "Tabletop / Mantel / Shelf" },
                            { label: "Spring Farmhouse Decor", size: '16" x 12"', placement: "Tabletop / Mantel / Shelf" },
                            { label: "Porch Leaner Sign", size: '48" x 10"', placement: "Front Porch / Floor Standing" }
                          ].map((item) => (
                            <button
                              key={item.label}
                              type="button"

                                setProjectType(item.label);

                              className={`text-[11px] font-semibold px-2.5 py-1 rounded-full border transition-colors ${
                                projectType === item.label
                                  ? "bg-blue-600 text-white border-blue-600"
                                  : "bg-slate-100 text-slate-600 border-slate-200 hover:bg-blue-50 hover:text-blue-700 hover:border-blue-200"
                              }`}
                            >
                              {item.label}
                            </button>
                          ))}
                        </div>
                      )}
                      {selectedCategory === "other" && (
                        <div className="flex flex-wrap gap-1.5 pt-0.5">
                          {QUICK_PROJECT_TYPES.slice(4).map((item) => (
                            <button
                              key={item.label}
                              type="button"
                              onClick={() => {
                                setProjectType(item.label);
                                setProjectSize(item.size);
                                setPlacementStyle(item.placement);
                              }}
                              className={`text-[11px] font-semibold px-2.5 py-1 rounded-full border transition-colors ${
                                projectType === item.label
                                  ? "bg-blue-600 text-white border-blue-600"
                                  : "bg-slate-100 text-slate-600 border-slate-200 hover:bg-blue-50 hover:text-blue-700 hover:border-blue-200"
                              }`}
                            >
                              {item.label}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className="flex flex-col gap-1">
                      <label className="text-xs font-semibold text-slate-600 flex items-center gap-1.5">
                        <LayersIcon size={14} /> Dimensions
                      </label>
                      <input
                        type="text"
                        value={projectSize}
                        onChange={(e) => setProjectSize(e.target.value)}
                        placeholder='e.g., 36" x 19.5"'
                        className="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm text-slate-800"
                      />
                    </div>

                    <div className="flex flex-col gap-1">
                      <label className="text-xs font-semibold text-slate-600 flex items-center gap-1.5">
                        <LayersIcon size={14} /> Placement Style
                      </label>
                      <select
                        value={placementStyle}
                        onChange={(e) => setPlacementStyle(e.target.value)}
                        className="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm text-slate-800 bg-white"
                      >
                        {PLACEMENT_OPTIONS.map((opt) => (
                          <option key={opt.value} value={opt.value}>
                            {opt.value}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div className="flex flex-col gap-1">
                      <label className="text-xs font-semibold text-slate-600 flex items-center gap-1.5">
                        <CropIcon size={14} /> Aspect Ratio
                      </label>
                      <select
                        value={aspectRatio}
                        onChange={(e) => setAspectRatio(e.target.value)}
                        className="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm text-slate-800 bg-white"
                      >
                        <option value="1:1">Square (1:1) — Best for FB</option>
                        <option value="4:3">Standard (4:3)</option>
                        <option value="16:9">Widescreen (16:9)</option>
                        <option value="9:16">Vertical (9:16) — Stories</option>
                        <option value="3:4">Portrait (3:4)</option>
                      </select>
                    </div>

                    <div className="flex flex-col gap-1">
                      <label className="text-xs font-semibold text-slate-600 flex items-center gap-1.5">
                        <FrameIcon size={14} /> Frame Style
                      </label>
                      <select
                        value={frameStyle}
                        onChange={(e) => setFrameStyle(e.target.value)}
                        className="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm text-slate-800 bg-white"
                      >
                        <option value="None">None (Frameless)</option>
                        <option value="Charred Wood">Charred Wood</option>
                        <option value="Dark Walnut">Dark Walnut</option>
                        <option value="Black Matte">Black Matte</option>
                        <option value="Rustic Barnwood">Rustic Barnwood</option>
                      </select>
                    </div>

                    <div className="flex flex-col gap-1 sm:col-span-2">
                      <label className="text-xs font-semibold text-slate-600 flex items-center gap-1.5">
                        <TypeIcon size={14} /> Watermark Text
                      </label>
                      <input
                        type="text"
                        value={watermarkText}
                        onChange={(e) => setWatermarkText(e.target.value)}
                        placeholder="Your Business Name"
                        className="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-sm text-slate-800"
                      />
                    </div>
                  </div>
                </div>

                {/* Step 4: Staging Environment */}
                <div className="space-y-3">
                  <h2 className="text-lg font-bold flex items-center gap-2 text-slate-800">
                    <span className="flex items-center justify-center w-6 h-6 rounded-full bg-blue-600 text-white text-xs font-bold">
                      4
                    </span>
                    Choose Staging Environment
                  </h2>

                  {/* Smart AI Suggestions */}
                  {isAnalyzing && (
                    <div className="flex items-center gap-2 text-xs sm:text-sm text-indigo-700 bg-indigo-50 p-3 rounded-xl border border-indigo-200 animate-pulse">
                      <SparklesIcon size={16} className="text-indigo-500 shrink-0" />
                      Analyzing your project for custom staging ideas...
                    </div>
                  )}

                  {aiSuggestions.length > 0 && !isAnalyzing && (
                    <div className="space-y-2">
                      <div className="text-xs font-bold text-indigo-700 uppercase tracking-wider flex items-center gap-1">
                        <LightbulbIcon size={14} /> Smart Suggestions for this item:
                      </div>
                      <div className="flex flex-col gap-2">
                        {aiSuggestions.map((suggestion, idx) => (
                          <button
                            key={`ai-${idx}`}
                            type="button"
                            onClick={() => setPrompt(suggestion)}
                            className="text-left text-xs sm:text-sm font-medium p-3 rounded-xl bg-indigo-50 text-indigo-900 hover:bg-indigo-100 transition-colors border border-indigo-200"
                          >
                            {suggestion}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="text-xs font-bold text-slate-500 uppercase tracking-wider pt-1">
                    Standard Presets:
                  </div>
                  <div className="flex gap-1.5 overflow-x-auto pb-1 custom-scrollbar">
                    {PRESET_CATEGORIES.map((cat) => (
                      <button
                        key={cat}
                        type="button"
                        onClick={() => setActivePresetCategory(cat)}
                        className={`shrink-0 text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors ${
                          activePresetCategory === cat
                            ? "bg-slate-900 text-white"
                            : "bg-slate-100 text-slate-600 hover:bg-slate-200"
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>
                  <div className="flex flex-wrap gap-2 max-h-40 overflow-y-auto p-1 custom-scrollbar">
                    {PRESET_PROMPTS.filter(
                      (p) => activePresetCategory === "All" || p.category === activePresetCategory
                    ).map((preset, idx) => (
                      <button
                        key={`${preset.label}-${idx}`}
                        type="button"
                        onClick={() => setPrompt(preset.text)}
                        className="text-xs font-medium px-3 py-1.5 rounded-full bg-slate-100 text-slate-700 hover:bg-blue-100 hover:text-blue-700 transition-colors border border-transparent hover:border-blue-200"
                      >
                        {preset.label}
                      </button>
                    ))}
                  </div>

                  <textarea
                    value={prompt}
                    onChange={(e) => setPrompt(e.target.value)}
                    placeholder="Describe where you want the project placed..."
                    className="w-full h-28 p-3.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none text-sm text-slate-700 leading-relaxed"
                  />
                </div>

                {/* Generate Button */}
                <button
                  onClick={handleGenerate}
                  disabled={!selectedImage || isGenerating}
                  className={`w-full py-4 rounded-2xl font-bold text-base sm:text-lg flex items-center justify-center gap-2 transition-all shadow-lg ${
                    !selectedImage || isGenerating
                      ? "bg-slate-200 text-slate-400 cursor-not-allowed shadow-none"
                      : "bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white hover:shadow-blue-500/30 active:scale-[0.99]"
                  }`}
                >
                  {isGenerating ? (
                    <>
                      <RefreshCwIcon className="animate-spin" size={22} />
                      Staging Your Project...
                    </>
                  ) : (
                    <>
                      <SparklesIcon size={22} />
                      Generate Staged Image
                    </>
                  )}
                </button>

                {/* Error Message */}
                {error && (
                  <div className="p-4 bg-red-50 text-red-700 rounded-xl border border-red-200 flex items-start gap-3">
                    <AlertCircleIcon className="shrink-0 mt-0.5" size={18} />
                    <p className="text-sm font-medium">{error}</p>
                  </div>
                )}
              </div>

              {/* Right Column: Result Preview */}
              <div className="flex-1 bg-slate-900 flex flex-col relative min-h-[420px] lg:min-h-full">
                {resultImage ? (
                  <div className="flex-1 flex flex-col">
                    <div className="p-4 flex justify-between items-center bg-slate-800 border-b border-slate-700 flex-wrap gap-2">
                      <h3 className="text-white font-semibold text-sm sm:text-base flex items-center gap-2">
                        <SparklesIcon className="text-amber-400" size={18} />
                        Staged Result
                      </h3>
                      <div className="flex items-center flex-wrap gap-2">
                        <button
                          onClick={() => setShowSlider(!showSlider)}
                          className="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs sm:text-sm font-medium transition-colors"
                        >
                          {showSlider ? "Hide Compare" : "Before / After"}
                        </button>
                        <button
                          onClick={() => handleDownload(resultImage)}
                          className="flex items-center gap-1.5 px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs sm:text-sm font-semibold transition-colors shadow-sm"
                        >
                          <DownloadIcon size={16} />
                          Save / Share
                        </button>
                        {queue.length > 0 && (
                          <button
                            onClick={processNextInQueue}
                            className="px-3 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-xl text-xs sm:text-sm font-semibold transition-colors"
                          >
                            Next ({queue.length})
                          </button>
                        )}
                      </div>
                    </div>

                    <div className="flex-1 p-4 md:p-8 flex items-center justify-center relative overflow-hidden">
                      <div className="relative max-w-full max-h-full inline-block shadow-2xl rounded-xl overflow-hidden select-none">
                        <img
                          src={resultImage}
                          alt="Staged Project Result"
                          className="max-w-full max-h-[65vh] object-contain block relative z-10"
                        />

                        {showSlider && selectedImage && (
                          <>
                            <div
                              className="absolute inset-0 z-20 overflow-hidden bg-slate-900/85 backdrop-blur-sm flex items-center justify-center"
                              style={{
                                clipPath: `polygon(0 0, ${sliderPosition}% 0, ${sliderPosition}% 100%, 0 100%)`
                              }}
                            >
                              <img
                                src={selectedImage}
                                alt="Original Project"
                                className="max-w-full max-h-full object-contain p-4"
                              />
                            </div>

                            <div
                              className="absolute top-0 bottom-0 z-30 w-1 bg-white shadow-[0_0_10px_rgba(0,0,0,0.8)] flex items-center justify-center pointer-events-none"
                              style={{ left: `calc(${sliderPosition}% - 2px)` }}
                            >
                              <div className="w-8 h-8 bg-blue-600 text-white rounded-full shadow-lg flex items-center justify-center text-xs font-bold border-2 border-white">
                                &lt;&gt;
                              </div>
                            </div>

                            <input
                              type="range"
                              min="0"
                              max="100"
                              value={sliderPosition}
                              onChange={(e) => setSliderPosition(e.target.value)}
                              className="compare-slider absolute inset-0 z-40 w-full h-full opacity-0 cursor-ew-resize m-0"
                            />
                          </>
                        )}
                      </div>
                    </div>
                  </div>
                ) : isGenerating ? (
                  <div className="flex-1 flex flex-col items-center justify-center text-slate-400 p-8 space-y-5">
                    <div className="w-20 h-20 relative">
                      <div className="absolute inset-0 border-4 border-slate-700 rounded-full"></div>
                      <div className="absolute inset-0 border-4 border-blue-500 rounded-full border-t-transparent animate-spin"></div>
                      <SparklesIcon className="absolute inset-0 m-auto text-blue-500 animate-pulse" size={28} />
                    </div>
                    <div className="text-center space-y-1.5">
                      <p className="text-lg font-semibold text-white">Nano Banana is staging your photo...</p>
                      <p className="text-sm text-slate-400">Matching lighting, shadows, and scale.</p>
                    </div>
                  </div>
                ) : (
                  <div className="flex-1 flex flex-col items-center justify-center text-slate-500 p-8">
                    <ImageIcon size={56} className="opacity-20 mb-4" />
                    <p className="text-base font-semibold text-slate-300">Your staged image will appear here</p>
                    <p className="text-xs sm:text-sm mt-1.5 text-center max-w-xs text-slate-400">
                      Upload a photo of your project and tap Generate.
                    </p>
                  </div>
                )}
              </div>
            </main>

            {/* Recent Generations Gallery */}
            {history.length > 0 && (
              <section className="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 p-6">
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-slate-800">
                  <HistoryIcon className="text-blue-600" size={22} />
                  Recent Generations
                </h2>
                <div className="flex gap-4 overflow-x-auto pb-3 custom-scrollbar">
                  {history.map((item) => (
                    <div
                      key={item.id}
                      onClick={() => {
                        setResultImage(item.staged);
                        setSelectedImage(item.original);
                        setPrompt(item.prompt);
                        window.scrollTo({ top: 0, behavior: "smooth" });
                      }}
                      className="flex-shrink-0 w-44 group relative rounded-2xl overflow-hidden border border-slate-200 shadow-sm hover:shadow-md transition-all cursor-pointer"
                    >
                      <img
                        src={item.staged}
                        alt="History thumbnail"
                        className="w-full h-44 object-cover group-hover:scale-105 transition-transform duration-300"
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent flex flex-col justify-end p-3">
                        <p className="text-white text-xs font-medium truncate">{item.prompt}</p>
                        <p className="text-slate-300 text-[10px] mt-0.5">{item.time}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </section>
            )}
          </div>

          {/* =================================================================
              API KEY SETTINGS MODAL (Private to this browser/device)
              ================================================================= */}
          {showSettingsModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full shadow-2xl border border-slate-100 overflow-hidden">
                <div className="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                  <h3 className="font-bold text-slate-900 flex items-center gap-2">
                    <KeyIcon size={18} className="text-blue-600" />
                    Private API Settings
                  </h3>
                  <button
                    onClick={() => setShowSettingsModal(false)}
                    className="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/70 transition-colors"
                  >
                    <CloseIcon size={18} />
                  </button>
                </div>

                <form onSubmit={saveSettings} className="p-6 space-y-5">
                  <div className="text-xs text-slate-600 bg-blue-50 border border-blue-100 rounded-xl p-3.5 leading-relaxed">
                    <p className="font-semibold text-blue-900 mb-1">100% Private on Your Device</p>
                    Your Gemini API key is saved only inside this browser's local storage and cookie. It is never stored on GitHub or shared with anyone else.
                  </div>

                  {storageBlocked && (
                    <div className="text-xs text-amber-900 bg-amber-50 border border-amber-200 rounded-xl p-3.5 leading-relaxed">
                      <p className="font-bold mb-1">Browser Storage Appears Blocked</p>
                      If you're in <strong>Private Browsing</strong> or viewing inside an embedded frame, your browser wipes saved keys when you leave. Open the GitHub Pages link directly in regular Safari/Chrome, or save the Private Bookmark Link below.
                    </div>
                  )}

                  <div className="space-y-1.5">
                    <div className="flex items-center justify-between">
                      <label className="text-xs font-bold text-slate-700 uppercase tracking-wider">
                        Gemini API Key
                      </label>
                      <a
                        href="https://aistudio.google.com/apikey"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="text-xs font-semibold text-blue-600 hover:underline"
                      >
                        Get Key at AI Studio &rarr;
                      </a>
                    </div>
                    <div className="relative">
                      <input
                        type={showKeyText ? "text" : "password"}
                        value={tempKey}
                        onChange={(e) => setTempKey(e.target.value)}
                        placeholder="AIzaSy..."
                        autoComplete="off"
                        className="w-full p-3 pr-16 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm font-mono"
                      />
                      <button
                        type="button"
                        onClick={() => setShowKeyText(!showKeyText)}
                        className="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-slate-500 hover:text-slate-800"
                      >
                        {showKeyText ? "Hide" : "Show"}
                      </button>
                    </div>
                  </div>

                  <div className="space-y-1.5">
                    <label className="text-xs font-bold text-slate-700 uppercase tracking-wider">
                      Image Model (Nano Banana)
                    </label>
                    <input
                      type="text"
                      value={tempModel}
                      onChange={(e) => setTempModel(e.target.value)}
                      className="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm font-mono text-slate-700"
                    />
                    <p className="text-[11px] text-slate-500">
                      Default: <code className="bg-slate-100 px-1 rounded">gemini-3.1-flash-image</code>
                    </p>
                  </div>

                  {(tempKey.trim() || apiKey) && (
                    <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-2">
                      <p className="text-[11px] text-slate-600 leading-relaxed">
                        <strong>Tip:</strong> If your browser keeps forgetting your key, copy this private link and bookmark it (don't share it publicly).
                      </p>
                      <button
                        type="button"
                        onClick={copyBookmarkLink}
                        className="w-full py-2 px-3 text-xs font-semibold bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 rounded-lg transition-colors"
                      >
                        Copy Private Auto-Login Bookmark Link
                      </button>
                    </div>
                  )}

                  <div className="flex items-center justify-between gap-3 pt-2">
                    {apiKey ? (
                      <button
                        type="button"
                        onClick={clearApiKey}
                        className="px-3 py-2.5 text-xs font-semibold text-red-600 hover:bg-red-50 rounded-xl transition-colors"
                      >
                        Clear Key
                      </button>
                    ) : (
                      <span />
                    )}
                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={() => setShowSettingsModal(false)}
                        className="px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="px-5 py-2.5 text-sm font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition-colors shadow-sm"
                      >
                        Save Settings
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    window.__STAGER_MOUNTED__ = true;
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
