<body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">
  <div id="root">
    <!-- Visible while scripts load so the screen is never blank -->
    <div id="boot-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#334155;padding:24px;text-align:center;">
      <div style="width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:#2563eb;border-radius:9999px;animation:spin 0.8s linear infinite;margin-bottom:14px;"></div>
      <div style="font-weight:700;font-size:16px;">Loading Stager App...</div>
      <div id="boot-error" style="margin-top:12px;max-width:460px;font-size:13px;color:#b91c1c;display:none;background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:12px;"></div>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </div>

  <!-- Global Error & Load Watchdog (prevents silent blank screens) -->
  <script>
    window.__STAGER_MOUNTED__ = false;
    function showBootError(msg) {
      var el = document.getElementById("boot-error");
      if (el) {
        el.style.display = "block";
        el.textContent = msg;
      }
    }
    window.addEventListener("error", function (e) {
      if (!window.__STAGER_MOUNTED__) {
        showBootError("App failed to start: " + (e.message || "Script error. Try refreshing."));
      }
    });
    setTimeout(function () {
      if (!window.__STAGER_MOUNTED__) {
        if (typeof React === "undefined" || typeof ReactDOM === "undefined" || typeof Babel === "undefined") {
          showBootError("Could not load required libraries (React/Babel). Check your internet connection or ad-blocker and refresh.");
        } else {
          showBootError("The app took too long to start. Try refreshing the page or clearing your browser cache.");
        }
      }
    }, 8000);
  </script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // Catch any React runtime error and show it on screen instead of a blank page
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, message: "" };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, message: error?.message || "Unexpected error" };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
              <div className="max-w-md w-full bg-white border border-red-200 rounded-2xl p-6 shadow-lg space-y-3">
                <h2 className="text-lg font-bold text-red-700">Something went wrong</h2>
                <p className="text-sm text-slate-600">{this.state.message}</p>
                <button
                  onClick={() => window.location.reload()}
                  className="px-4 py-2 bg-blue-600 text-white text-sm font-semibold rounded-xl"
                >
                  Reload App
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    /* =========================================================================

    const SparklesIcon = (props) => (

        <path d="M5 3v4" /><path d="M19 17v4" /><path d="M3 5h4" /><path d="M17 19h4" />

    const UploadCloudIcon = (props) => (

    const AlertCircleIcon = (props) => (

    const HistoryIcon = (props) => (

    const KeyIcon = (props) => (

    const LightbulbIcon = (props) => (

        <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5" />

    const LayersIcon = (props) => (

    const CropIcon = (props) => (

    const FrameIcon = (props) => (

    const TypeIcon = (props) => (

    const CloseIcon = (props) => (

    );

    /* =========================================================================
       STORAGE KEYS & CONSTANTS
       ========================================================================= */
    const STORAGE_KEY_API = "jrg_stager_gemini_api_key";
    const STORAGE_KEY_MODEL = "jrg_stager_image_model";
    const DEFAULT_IMAGE_MODEL = "gemini-3.1-flash-image";
    const SUGGESTION_MODEL = "gemini-3-flash-preview";

    /* =========================================================================
       PERSISTENT STORAGE HELPERS (localStorage + Cookie fallback + URL #hash)
       ========================================================================= */
    const setCookie = (name, value, days = 365) => {
      try {
        const expires = new Date(Date.now() + days * 864e5).toUTCString();
        document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
      } catch (e) {
        // Ignore cookie errors in restricted contexts
      }
    };

    const getCookie = (name) => {
      try {
        const match = document.cookie.match(new RegExp("(^| )" + name + "=([^;]+)"));
        return match ? decodeURIComponent(match[2]) : "";
      } catch (e) {
        return "";
      }
    };

    const deleteCookie = (name) => {
      try {
        document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; SameSite=Lax`;
      } catch (e) {}
    };

    const savePersistent = (key, value) => {
      let saved = false;
      try {
        localStorage.setItem(key, value);
        if (localStorage.getItem(key) === value) saved = true;
      } catch (e) {}
      setCookie(key, value, 365);
      if (getCookie(key) === value) saved = true;
      return saved;
    };

    const loadPersistent = (key) => {
      try {
        const val = localStorage.getItem(key);
        if (val) return val;
      } catch (e) {}
      return getCookie(key) || "";
    };

    const removePersistent = (key) => {
      try {
        localStorage.removeItem(key);
      } catch (e) {}
      deleteCookie(key);
    };

    const checkStorageAvailable = () => {
      const testKey = "__jrg_storage_test__";
      const ok = savePersistent(testKey, "1");
      removePersistent(testKey);
      return ok;
    };

    // Read API key from private #key=... URL hash if present (never sent to server)
    const extractHashApiKey = () => {
      try {
        const hash = window.location.hash || "";
        const match = hash.match(/key=([^&]+)/);
        if (match && match[1]) {
          const decoded = decodeURIComponent(match[1]).trim();
          if (decoded) {
            savePersistent(STORAGE_KEY_API, decoded);
            // Clean key from address bar after loading
            if (window.history && window.history.replaceState) {
              window.history.replaceState(null, "", window.location.pathname + window.location.search);
            }
            return decoded;
          }
        }
      } catch (e) {}
      return "";
    };

    const PRESET_PROMPTS = [
      { label: "Rustic: Brick Fireplace", text: "Mounted on the wall of a well-lit, rustic living room above a brick fireplace. Cozy lighting." },
      { label: "Rustic: Log Cabin", text: "Placed in a rustic log cabin with a grand stone fireplace. Warm fire glowing, dim ambient lighting." },
      { label: "Kitchen: Farmhouse", text: "Placed in a modern farmhouse kitchen with bright natural light, white marble countertops, and rustic accents." },
      { label: "Living Room: Modern", text: "Placed in a cozy, modern living room. Bright natural light, neutral color palette, stylish decor." },
      { label: "Living Room: Industrial", text: "Placed in an industrial loft living room with exposed red brick walls and large factory windows." },
      { label: "Man Cave: Upscale", text: "Placed in a moody, upscale man cave with warm amber accent lighting and dark wood finishes." },
      { label: "Man Cave: Home Bar", text: "Displayed behind a custom wood home bar with warm pendant lights, leather stools, and sports memorabilia." },
      { label: "Patio: Outdoor BBQ", text: "Placed in a beautiful backyard patio next to an outdoor BBQ kitchen setup. Bright summer afternoon lighting." },
      { label: "Patio: Twilight Deck", text: "Displayed on a covered cedar patio deck at twilight with warm Edison string lights glowing softly." },
      { label: "Dining: Elegant", text: "Placed in an elegant dining room with a large wooden table, ambient chandelier lighting, and a cozy atmosphere." }
    ];

    /* =========================================================================
       MAIN APPLICATION COMPONENT
       ========================================================================= */
    const App = () => {
      // --- API Key & Model State (Stored locally in browser only) ---
      const [apiKey, setApiKey] = useState(() => extractHashApiKey() || loadPersistent(STORAGE_KEY_API) || "");
      const [imageModel, setImageModel] = useState(() => loadPersistent(STORAGE_KEY_MODEL) || DEFAULT_IMAGE_MODEL);
      const [storageBlocked, setStorageBlocked] = useState(() => !checkStorageAvailable());
      const [showSettingsModal, setShowSettingsModal] = useState(false);
      const [tempKey, setTempKey] = useState("");
      const [tempModel, setTempModel] = useState(DEFAULT_IMAGE_MODEL);
      const [showKeyText, setShowKeyText] = useState(false);

      // --- Core Staging State ---
      const [selectedImage, setSelectedImage] = useState(null);
      const [base64Data, setBase64Data] = useState(null);
      const [mimeType, setMimeType] = useState(null);
      const [projectType, setProjectType] = useState("Wood Wavy American Flag");
      const [projectSize, setProjectSize] = useState('36" x 19.5"');
      const [prompt, setPrompt] = useState(
        "Mounted on the wall of a well-lit, rustic living room above a brick fireplace. The lighting should be realistic, cozy, and high quality."
      );
      const [isGenerating, setIsGenerating] = useState(false);
      const [resultImage, setResultImage] = useState(null);
      const [error, setError] = useState(null);
      const fileInputRef = useRef(null);

      // --- Enhancement & UI State ---
      const [isDragging, setIsDragging] = useState(false);
      const [aspectRatio, setAspectRatio] = useState("1:1");
      const [frameStyle, setFrameStyle] = useState("None");
      const [watermarkText, setWatermarkText] = useState("JRG Custom Builds");
      const [sliderPosition, setSliderPosition] = useState(50);
      const [showSlider, setShowSlider] = useState(false);
      const [history, setHistory] = useState([]);
      const [queue, setQueue] = useState([]);
      const [aiSuggestions, setAiSuggestions] = useState([]);
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [statusToast, setStatusToast] = useState(null);
      const toastTimeoutRef = useRef(null);

      // Show a temporary status toast notification
      const notify = (msg) => {
        setStatusToast(msg);
        if (toastTimeoutRef.current) clearTimeout(toastTimeoutRef.current);
        toastTimeoutRef.current = setTimeout(() => setStatusToast(null), 3500);
      };

      // Open the private API Key & Model settings modal
      const openSettings = () => {
        setTempKey(apiKey);
        setTempModel(imageModel);
        setShowKeyText(false);
        setShowSettingsModal(true);
      };

      // Save API Key & Model to localStorage + Cookie fallback
      const saveSettings = (e) => {
        e.preventDefault();
        const cleanedKey = tempKey.trim();
        const cleanedModel = tempModel.trim() || DEFAULT_IMAGE_MODEL;

        setApiKey(cleanedKey);
        setImageModel(cleanedModel);

        if (cleanedKey) {
          const persisted = savePersistent(STORAGE_KEY_API, cleanedKey);
          setStorageBlocked(!persisted);
          notify(
            persisted
              ? "API key saved privately on this device."
              : "Key active for this session (browser is blocking permanent storage)."
          );
        } else {
          removePersistent(STORAGE_KEY_API);
          notify("API key cleared from this device.");
        }
        savePersistent(STORAGE_KEY_MODEL, cleanedModel);
        setShowSettingsModal(false);
        setError(null);
      };

      const clearApiKey = () => {
        setTempKey("");
        setApiKey("");
        removePersistent(STORAGE_KEY_API);
        notify("API key removed from this device.");
      };

      // Copy a private auto-login bookmark link (#key=... stays strictly in the browser)
      const copyBookmarkLink = () => {
        const keyToUse = (tempKey || apiKey).trim();
        if (!keyToUse) return;
        const baseUrl = window.location.href.split("#")[0];
        const bookmarkUrl = `${baseUrl}#key=${encodeURIComponent(keyToUse)}`;

        const tempInput = document.createElement("textarea");
        tempInput.value = bookmarkUrl;
        tempInput.style.position = "fixed";
        tempInput.style.opacity = "0";
        document.body.appendChild(tempInput);
        tempInput.select();
        try {
          document.execCommand("copy");
          notify("Private bookmark link copied! Save it to your bookmarks.");
        } catch (err) {
          notify("Could not copy automatically. Please copy from settings.");
        }
        document.body.removeChild(tempInput);
      };

      // --- AI Visual Analysis for Smart Staging Suggestions ---
      const getAiSuggestions = async (base64, mime, keyOverride = null) => {
        const activeKey = keyOverride || apiKey;
        if (!activeKey) return;

        setIsAnalyzing(true);
        setAiSuggestions([]);
        try {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${SUGGESTION_MODEL}:generateContent?key=${encodeURIComponent(activeKey)}`;

          const aiPrompt =
            "Analyze this woodworking project. Create 3 highly descriptive staging environment prompts suitable for a Facebook Marketplace listing. The environments should complement the style of the item perfectly. Return ONLY a JSON object with a single property 'prompts' containing an array of 3 strings. Each string should be a full descriptive prompt.";

          const payload = {
            contents: [
              {
                role: "user",
                parts: [
                  { text: aiPrompt },
                  { inlineData: { mimeType: mime, data: base64 } }
                ]
              }
            ],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  prompts: {
                    type: "ARRAY",
                    items: { type: "STRING" }
                  }
                }
              }
            }
          };

          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (jsonText) {
            const parsed = JSON.parse(jsonText);
            if (Array.isArray(parsed.prompts)) {
              setAiSuggestions(parsed.prompts);
            }
          }
        } catch (err) {
          console.error("Failed to fetch AI suggestions:", err);
        } finally {
          setIsAnalyzing(false);
        }
      };

      // --- File Processing & Drag/Drop ---
      const processFile = (file) => {
        if (!file) return;
        setSelectedImage(URL.createObjectURL(file));
        setResultImage(null);
        setError(null);
        setShowSlider(false);
        setAiSuggestions([]);

        const reader = new FileReader();
        reader.onloadend = () => {
          const result = reader.result;
          const match = result.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,(.+)$/);
          if (match) {
            setMimeType(match[1]);
            setBase64Data(match[2]);
            if (apiKey) {
              getAiSuggestions(match[2], match[1]);
            }
          } else {
            setError("Failed to process image format. Please use JPG, PNG, or WEBP.");
          }
        };
        reader.readAsDataURL(file);
      };

      const handleImageUpload = (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length > 0) {
          processFile(files[0]);
          setQueue(files.length > 1 ? files.slice(1) : []);
        }
      };

      const onDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const onDragLeave = (e) => {
        e.preventDefault();
        setIsDragging(false);
      };

      const onDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        const files = Array.from(e.dataTransfer.files || []).filter((f) =>
          f.type.startsWith("image/")
        );
        if (files.length > 0) {
          processFile(files[0]);
          setQueue(files.length > 1 ? files.slice(1) : []);
        }
      };

      // --- Image Generation via Gemini (Nano Banana) ---
      const handleGenerate = async () => {
        if (!apiKey) {
          setError("Please add your Google AI Studio API key first.");
          openSettings();
          return;
        }
        if (!base64Data || !mimeType) {
          setError("Please upload an image first.");
          return;
        }
        if (!prompt.trim()) {
          setError("Please enter a staging description.");
          return;
        }

        setIsGenerating(true);
        setError(null);
        setResultImage(null);
        setShowSlider(false);

        try {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(
            imageModel
          )}:generateContent?key=${encodeURIComponent(apiKey)}`;

          let finalPrompt = `Take the provided image of the ${projectType} and perfectly integrate it into the following scene: ${prompt}. The physical dimensions of this item are approximately ${projectSize}. `;

          if (frameStyle !== "None") {
            finalPrompt += `The item should have a beautiful ${frameStyle} frame around it. `;
          }

          finalPrompt += `
CRITICAL INSTRUCTIONS:
- Automatically remove the original background from the provided image before placing it in the scene. Only the item itself should be placed.
- Ensure the item is scaled realistically relative to the furniture, walls, and overall room size in the generated environment.
- Ensure the item looks natural in the environment with correct shadows, lighting, and perspective.
- DO NOT alter the wood grain, do NOT change specific details of the item, and DO NOT warp or distort the project itself. Preserve the original craftsmanship exactly.`;

          const payload = {
            contents: [
              {
                role: "user",
                parts: [
                  { text: finalPrompt },
                  {
                    inlineData: {
                      mimeType: mimeType,
                      data: base64Data
                    }
                  }
                ]
              }
            ],
            generationConfig: {
              responseModalities: ["IMAGE"],
              imageConfig: { aspectRatio: aspectRatio }
            }
          };

          const response = await fetch(apiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(
              result.error?.message || "Failed to generate image. Double-check your API key and model name."
            );
          }

          const generatedPart = result?.candidates?.[0]?.content?.parts?.find(
            (p) => p.inlineData
          );

          if (generatedPart) {
            const generatedImageUrl = `data:${generatedPart.inlineData.mimeType};base64,${generatedPart.inlineData.data}`;
            setResultImage(generatedImageUrl);

            setHistory((prev) =>
              [
                {
                  id: Date.now(),
                  original: selectedImage,
                  staged: generatedImageUrl,
                  prompt: prompt,
                  time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
                },
                ...prev
              ].slice(0, 10)
            );
          } else {
            throw new Error("No image data found in the API response. Try adjusting your prompt.");
          }
        } catch (err) {
          console.error(err);
          setError(err.message || "An unexpected error occurred during generation.");
        } finally {
          setIsGenerating(false);
        }
      };

      const processNextInQueue = () => {
        if (queue.length > 0) {
          const nextFile = queue[0];
          setQueue((prev) => prev.slice(1));
          processFile(nextFile);
        }
      };

      // --- Watermark + iPhone Share Sheet / Desktop Download ---
      const handleDownload = (imgUrl = resultImage) => {
        if (!imgUrl) return;

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const img = new Image();
        img.crossOrigin = "Anonymous";

        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);

          if (watermarkText.trim()) {
            const fontSize = Math.max(24, Math.round(canvas.height * 0.035));
            ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
            ctx.fillStyle = "rgba(255, 255, 255, 0.78)";
            ctx.shadowColor = "rgba(0, 0, 0, 0.85)";
            ctx.shadowBlur = 8;
            ctx.textAlign = "right";
            ctx.fillText(watermarkText.trim(), canvas.width - 30, canvas.height - 30);
          }

          canvas.toBlob(async (blob) => {
            if (!blob) return;
            const fileName = `jrg-staged-${Date.now()}.png`;
            const file = new File([blob], fileName, { type: "image/png" });

            const fallbackDownload = () => {
              const a = document.createElement("a");
              a.href = canvas.toDataURL("image/png");
              a.download = fileName;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
            };

            // iOS / Mobile Native Share Sheet
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              try {
                await navigator.share({
                  files: [file],
                  title: "Staged Project — JRG Custom Builds"
                });
              } catch (err) {
                if (err.name !== "AbortError") {
                  fallbackDownload();
                }
              }
            } else {
              fallbackDownload();
            }
          }, "image/png");
        };
        img.src = imgUrl;
      };

      return (

                        onChange={(e) => setTempKey(e.target.value)}
                        placeholder="AIzaSy..."
                        autoComplete="off"
                        className="w-full p-3 pr-16 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm font-mono"
                      />
                      <button
                        type="button"
                        onClick={() => setShowKeyText(!showKeyText)}
                        className="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-slate-500 hover:text-slate-800"
                      >
                        {showKeyText ? "Hide" : "Show"}
                      </button>
                    </div>
                  </div>

                  <div className="space-y-1.5">
                    <label className="text-xs font-bold text-slate-700 uppercase tracking-wider">
                      Image Model (Nano Banana)
                    </label>
                    <input
                      type="text"
                      value={tempModel}
                      onChange={(e) => setTempModel(e.target.value)}
                      className="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm font-mono text-slate-700"
                    />
                    <p className="text-[11px] text-slate-500">
                      Default: <code className="bg-slate-100 px-1 rounded">gemini-3.1-flash-image</code>
                    </p>
                  </div>

                  {(tempKey.trim() || apiKey) && (
                    <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-2">
                      <p className="text-[11px] text-slate-600 leading-relaxed">
                        <strong>Tip:</strong> If your browser keeps forgetting your key, copy this private link and bookmark it (don't share it publicly).
                      </p>
                      <button
                        type="button"
                        onClick={copyBookmarkLink}
                        className="w-full py-2 px-3 text-xs font-semibold bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 rounded-lg transition-colors"
                      >
                        Copy Private Auto-Login Bookmark Link
                      </button>
                    </div>
                  )}

                  <div className="flex items-center justify-between gap-3 pt-2">
                    {apiKey ? (
                      <button
                        type="button"
                        onClick={clearApiKey}
                        className="px-3 py-2.5 text-xs font-semibold text-red-600 hover:bg-red-50 rounded-xl transition-colors"
                      >
                        Clear Key
                      </button>
                    ) : (
                      <span />
                    )}
                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={() => setShowSettingsModal(false)}
                        className="px-4 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        className="px-5 py-2.5 text-sm font-semibold bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition-colors shadow-sm"
                      >
                        Save Settings
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    window.__STAGER_MOUNTED__ = true;
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
